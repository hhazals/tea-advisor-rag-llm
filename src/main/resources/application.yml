spring:
  application:
    name: tea-rag
  config:
    # Gizli anahtarlar proje kökündeki .env dosyasında (git'e girmez), ör. USDA_API_KEY=...
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:tea_rag}
    username: ${DB_USER:tea_rag}
    password: ${DB_PASSWORD:tea_rag}
  jpa:
    open-in-view: false
    hibernate:
      # Şema yalnızca Flyway ile yönetilir; Hibernate sadece entity'leri doğrular.
      ddl-auto: validate
  autoconfigure:
    # Gemini yalnızca chat için; embedding Ollama'da (iki EmbeddingModel bean'i olmasın)
    exclude: org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
  ai:
    model:
      chat: google-genai
      embedding: ollama
    google:
      genai:
        # https://aistudio.google.com/apikey — .env dosyasına GEMINI_API_KEY=... olarak yaz
        # Anahtar yoksa istemci başlatılamadığı için yer tutucu; servis bunu görünce LLM'i çağırmaz
        api-key: ${GEMINI_API_KEY:not-configured}
        chat:
          options:
            # 17.11.2026 denemesi: 2.5-flash 404, 3.5/3.8-flash 503/zaman aşımı, *-flash-lite çalışıyor
            model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
            temperature: 0.2
            response-mime-type: application/json
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: paraphrase-multilingual
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8

tearag:
  rag:
    # En iyi parçanın kosinüs benzerliği bunun altındaysa LLM çağrılmaz, kural tabanlı öneri döner
    similarity-threshold: 0.4
    top-k: 3
  usda:
    base-url: https://api.nal.usda.gov/fdc
    # DEMO_KEY saatte ~30 istekle sınırlı; kendi anahtarını .env'e USDA_API_KEY olarak yaz
    api-key: ${USDA_API_KEY:DEMO_KEY}
    data-types:
      - Survey (FNDDS)
      - SR Legacy
      - Foundation
    connect-timeout: 5s
    read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: always
